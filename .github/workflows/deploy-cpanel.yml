name: Desplegar en cPanel (HostArmada)

# Cada push a main reconstruye el sitio y lo sincroniza por SSH con la
# carpeta del dominio en HostArmada.
#
# Se puede lanzar a mano desde la pestaña Actions, con la casilla `simulacion`
# marcada, para ver qué archivos SE SUBIRÍAN sin tocar el servidor. Conviene
# usarlo la primera vez.
#
# `repository_dispatch` es el que usa el botón "Publicar cambios" del panel:
# el contenido vive en Supabase, pero la web son páginas ya generadas, así
# que editar un tour no se ve hasta que este workflow vuelve a compilarla.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publicar-contenido]
  workflow_dispatch:
    inputs:
      simulacion:
        description: "Simular: listar cambios sin subir nada"
        type: boolean
        default: false

# Un despliegue a la vez. Sin esto, dos push seguidos podrían escribir en
# public_html al mismo tiempo y dejar el sitio a medias.
concurrency:
  group: cpanel
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build
        # Sin BASE_PATH: en cPanel el sitio vive en la raíz del dominio.
        # NEXT_PUBLIC_SITE_URL alimenta canonical, hreflang, sitemap y robots.
        #
        # Las claves de Supabase son las que hacen que el contenido del panel
        # llegue a la web: sin ellas la compilación cae al respaldo de
        # `src/data/` y los cambios no aparecerían nunca. La anónima puede ir
        # aquí porque acaba dentro del JavaScript público de todos modos; lo
        # que la protege son las políticas RLS, no el secreto.
        env:
          NEXT_PUBLIC_SITE_URL: https://gotomachupicchuperu.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Reseñas de TripAdvisor (src/lib/tripadvisor.ts). Esta sí es secreta:
          # solo se usa al compilar y no llega al JavaScript público. Sin ella
          # la web enseña las reseñas del panel.
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
          # Verificación de Google Search Console por etiqueta HTML. Es la vía
          # alternativa: si la propiedad se verifica por DNS —que es lo
          # recomendable, porque cubre www, http y subdominios de una vez—
          # este secreto puede quedarse vacío y no pasa nada.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Comprobar el build antes de subir
        run: |
          test -f out/index.html   || { echo "Falta out/index.html"; exit 1; }
          test -f out/.htaccess    || { echo "Falta out/.htaccess";  exit 1; }
          test -d out/es           || { echo "Falta out/es";         exit 1; }
          echo "Archivos a publicar: $(find out -type f | wc -l)"

      # Por qué rsync sobre SSH y no FTP.
      #
      # Se intentó FTPS dos veces, con dos herramientas distintas, y las dos
      # murieron a mitad de subida:
      #
      #   SamKirkland/FTP-Deploy-Action  →  "Server sent FIN packet
      #     unexpectedly" a los 2 minutos. No sabe reconectar: se rinde y deja
      #     public_html a medias, con media web nueva y media vieja.
      #   lftp con reintentos            →  aguantó 18 minutos y acabó en
      #     "max-retries exceeded".
      #
      # La causa es el hosting: subir 764 ficheros pequeños seguidos dispara
      # la protección anti-abuso del servidor compartido, que corta la
      # conexión una y otra vez. No es un problema de credenciales ni de
      # configuración; es que FTP no encaja con este reparto.
      #
      # SSH resuelve el problema de raíz: una sola conexión para todo, así que
      # no hay nada que disparar. Y rsync compara contenido de verdad, no
      # fechas, de modo que los despliegues siguientes mandan solo lo que
      # cambió y tardan segundos en vez de minutos.
      # ── Destino: HostArmada ────────────────────────────────────────────────
      # Desde el 1-oct-2026 el sitio vive en HostArmada, como dominio adicional
      # de la cuenta `naca1.armadaservers.com`. El hospedaje de Namecheap venció
      # y su paso se quitó: con él dentro, cada publicación fallaba al no poder
      # entrar en un servidor que ya no es nuestro.
      #
      # Secretos (Settings → Secrets and variables → Actions):
      #   HA_SSH_KEY         clave privada SIN contraseña (obligatorio)
      #   HA_SSH_USER        usuario de cPanel (obligatorio)
      #   HA_SSH_TARGET_DIR  carpeta del dominio, p. ej. public_html/gotomachupicchuperu.com (obligatorio)
      #   HA_SSH_HOST        opcional; por defecto naca1.armadaservers.com
      #   HA_SSH_PORT        opcional; por defecto 19199, el puerto fijo de HostArmada
      - name: Preparar la clave SSH de HostArmada
        env:
          HA_SSH_KEY: ${{ secrets.HA_SSH_KEY }}
          HA_SSH_USER: ${{ secrets.HA_SSH_USER }}
          HA_SSH_HOST: ${{ secrets.HA_SSH_HOST || 'naca1.armadaservers.com' }}
          HA_SSH_PORT: ${{ secrets.HA_SSH_PORT || '19199' }}
          HA_DESTINO: ${{ secrets.HA_SSH_TARGET_DIR }}
        run: |
          set -euo pipefail
          : "${HA_SSH_KEY:?Falta el secreto HA_SSH_KEY (la clave privada, ver MIGRACION-HOSTARMADA.md)}"
          : "${HA_SSH_USER:?Falta el secreto HA_SSH_USER (el usuario de cPanel)}"
          : "${HA_DESTINO:?Falta el secreto HA_SSH_TARGET_DIR (la carpeta del dominio)}"

          # Salvaguarda: esa cuenta aloja OTRA web en public_html. Con
          # --delete, desplegar ahí borraría esa otra web entera. El sitio
          # tiene que ir a su propia carpeta de dominio adicional.
          limpio="${HA_DESTINO%/}"
          if [ "$limpio" = "public_html" ] || [ "$limpio" = "~/public_html" ] || [ -z "$limpio" ] || [ "$limpio" = "." ]; then
            echo "HA_SSH_TARGET_DIR vale «$HA_DESTINO»: es la carpeta de la OTRA web de la cuenta."
            echo "Debe ser la carpeta del dominio adicional, p. ej. public_html/gotomachupicchuperu.com"
            exit 1
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HA_SSH_KEY" > ~/.ssh/id_hostarmada
          chmod 600 ~/.ssh/id_hostarmada
          # Se apunta la huella del servidor al empezar, con reintentos: un
          # servidor compartido puede tardar más de los 5 s que espera
          # ssh-keyscan por defecto, y un corte puntual no debe tumbar la
          # publicación entera.
          for intento in 1 2 3; do
            ssh-keyscan -T 20 -p "$HA_SSH_PORT" -H "$HA_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts && break
            echo "ssh-keyscan sin respuesta (intento $intento de 3)"; sleep 10
          done
          test -s ~/.ssh/known_hosts || { echo "HostArmada no respondió al ssh-keyscan tras 3 intentos (¿puerto o host incorrectos?)"; exit 1; }

      - name: Sincronizar con HostArmada
        env:
          HA_SSH_USER: ${{ secrets.HA_SSH_USER }}
          HA_SSH_HOST: ${{ secrets.HA_SSH_HOST || 'naca1.armadaservers.com' }}
          HA_SSH_PORT: ${{ secrets.HA_SSH_PORT || '19199' }}
          HA_DESTINO: ${{ secrets.HA_SSH_TARGET_DIR }}
          SIMULACION: ${{ inputs.simulacion }}
        run: |
          set -euo pipefail
          SECO=""
          if [ "${SIMULACION:-false}" = "true" ]; then
            SECO="--dry-run"
            echo "MODO SIMULACIÓN: no se escribe nada en el servidor."
          fi
          # --delete quita del servidor lo que ya no existe en el sitio, para
          # que no queden páginas viejas accesibles. Las exclusiones son
          # críticas: .well-known guarda la validación del certificado SSL, y
          # borrarla rompería el HTTPS en la siguiente renovación; cgi-bin es
          # de cPanel.
          rsync -rlvz --human-readable --partial $SECO \
            --delete \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude '.git*' \
            -e "ssh -i $HOME/.ssh/id_hostarmada -p $HA_SSH_PORT" \
            ./out/ "$HA_SSH_USER@$HA_SSH_HOST:${HA_DESTINO%/}/" | tail -40

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_hostarmada
