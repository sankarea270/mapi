name: Desplegar en cPanel (Namecheap)

# Cada push a main reconstruye el sitio y sincroniza public_html por SSH.
#
# Se puede lanzar a mano desde la pestaña Actions, con la casilla `simulacion`
# marcada, para ver qué archivos SE SUBIRÍAN sin tocar el servidor. Conviene
# usarlo la primera vez.
#
# `repository_dispatch` es el que usa el botón "Publicar cambios" del panel:
# el contenido vive en Supabase, pero la web son páginas ya generadas, así
# que editar un tour no se ve hasta que este workflow vuelve a compilarla.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publicar-contenido]
  workflow_dispatch:
    inputs:
      simulacion:
        description: "Simular: listar cambios sin subir nada"
        type: boolean
        default: false

# Un despliegue a la vez. Sin esto, dos push seguidos podrían escribir en
# public_html al mismo tiempo y dejar el sitio a medias.
concurrency:
  group: cpanel
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build
        # Sin BASE_PATH: en cPanel el sitio vive en la raíz del dominio.
        # NEXT_PUBLIC_SITE_URL alimenta canonical, hreflang, sitemap y robots.
        #
        # Las claves de Supabase son las que hacen que el contenido del panel
        # llegue a la web: sin ellas la compilación cae al respaldo de
        # `src/data/` y los cambios no aparecerían nunca. La anónima puede ir
        # aquí porque acaba dentro del JavaScript público de todos modos; lo
        # que la protege son las políticas RLS, no el secreto.
        env:
          NEXT_PUBLIC_SITE_URL: https://gotomachupicchuperu.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Verificación de Google Search Console por etiqueta HTML. Es la vía
          # alternativa: si la propiedad se verifica por DNS —que es lo
          # recomendable, porque cubre www, http y subdominios de una vez—
          # este secreto puede quedarse vacío y no pasa nada.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}

      - name: Comprobar el build antes de subir
        run: |
          test -f out/index.html   || { echo "Falta out/index.html"; exit 1; }
          test -f out/.htaccess    || { echo "Falta out/.htaccess";  exit 1; }
          test -d out/es           || { echo "Falta out/es";         exit 1; }
          echo "Archivos a publicar: $(find out -type f | wc -l)"

      # Por qué rsync sobre SSH y no FTP.
      #
      # Se intentó FTPS dos veces, con dos herramientas distintas, y las dos
      # murieron a mitad de subida:
      #
      #   SamKirkland/FTP-Deploy-Action  →  "Server sent FIN packet
      #     unexpectedly" a los 2 minutos. No sabe reconectar: se rinde y deja
      #     public_html a medias, con media web nueva y media vieja.
      #   lftp con reintentos            →  aguantó 18 minutos y acabó en
      #     "max-retries exceeded".
      #
      # La causa es el hosting: subir 764 ficheros pequeños seguidos dispara
      # la protección anti-abuso del servidor compartido, que corta la
      # conexión una y otra vez. No es un problema de credenciales ni de
      # configuración; es que FTP no encaja con este reparto.
      #
      # SSH resuelve el problema de raíz: una sola conexión para todo, así que
      # no hay nada que disparar. Y rsync compara contenido de verdad, no
      # fechas, de modo que los despliegues siguientes mandan solo lo que
      # cambió y tardan segundos en vez de minutos.
      - name: Preparar la clave SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          # Se apunta la huella del servidor al empezar. No es una
          # comprobación fuerte —se confía en quien responda la primera vez—,
          # pero evita tener que desactivar la verificación por completo, que
          # es lo que se suele hacer y deja la conexión abierta a suplantación
          # durante toda la ejecución.
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "El servidor no respondió al ssh-keyscan"; exit 1; }

      - name: Sincronizar por rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
          DESTINO: ${{ secrets.SSH_TARGET_DIR || 'public_html' }}
          SIMULACION: ${{ inputs.simulacion }}
        run: |
          set -euo pipefail
          SECO=""
          if [ "${SIMULACION:-false}" = "true" ]; then
            SECO="--dry-run"
            echo "MODO SIMULACIÓN: no se escribe nada en el servidor."
          fi

          # --delete quita del servidor lo que ya no existe en el sitio, para
          # que no queden páginas viejas accesibles. Las exclusiones son
          # críticas: .well-known guarda la validación del certificado SSL, y
          # borrarla rompería el HTTPS en la siguiente renovación.
          rsync -rlvz --human-readable --partial $SECO \
            --delete \
            --exclude '.well-known/' \
            --exclude 'cgi-bin/' \
            --exclude '.ftp-deploy-sync-state.json' \
            --exclude '.git*' \
            -e "ssh -i $HOME/.ssh/id_despliegue -p $SSH_PORT" \
            ./out/ "$SSH_USER@$SSH_HOST:$DESTINO/" | tail -40

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_despliegue
