name: Desplegar en cPanel (Namecheap)

# Cada push a main reconstruye el sitio y sincroniza public_html por FTPS.
#
# Se puede lanzar a mano desde la pestaña Actions, con la casilla `simulacion`
# marcada, para ver qué archivos SE SUBIRÍAN sin tocar el servidor. Conviene
# usarlo la primera vez.
#
# `repository_dispatch` es el que usa el botón "Publicar cambios" del panel:
# el contenido vive en Supabase, pero la web son páginas ya generadas, así
# que editar un tour no se ve hasta que este workflow vuelve a compilarla.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publicar-contenido]
  workflow_dispatch:
    inputs:
      simulacion:
        description: "Simular: listar cambios sin subir nada"
        type: boolean
        default: false

# Un despliegue a la vez. Sin esto, dos push seguidos podrían escribir en
# public_html al mismo tiempo y dejar el sitio a medias.
concurrency:
  group: cpanel
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Compilar
        run: npm run build
        # Sin BASE_PATH: en cPanel el sitio vive en la raíz del dominio.
        # NEXT_PUBLIC_SITE_URL alimenta canonical, hreflang, sitemap y robots.
        #
        # Las claves de Supabase son las que hacen que el contenido del panel
        # llegue a la web: sin ellas la compilación cae al respaldo de
        # `src/data/` y los cambios no aparecerían nunca. La anónima puede ir
        # aquí porque acaba dentro del JavaScript público de todos modos; lo
        # que la protege son las políticas RLS, no el secreto.
        env:
          NEXT_PUBLIC_SITE_URL: https://gotomachupicchuperu.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Comprobar el build antes de subir
        run: |
          test -f out/index.html   || { echo "Falta out/index.html"; exit 1; }
          test -f out/.htaccess    || { echo "Falta out/.htaccess";  exit 1; }
          test -d out/es           || { echo "Falta out/es";         exit 1; }
          echo "Archivos a publicar: $(find out -type f | wc -l)"

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Antes se usaba SamKirkland/FTP-Deploy-Action. Funcionaba, pero se caía
      # a los dos minutos con "Server sent FIN packet unexpectedly": el
      # cortafuegos anti-abuso del hosting compartido corta la conexión cuando
      # recibe cientos de ficheros pequeños seguidos, y esa acción no sabe
      # reconectar —se rinde y deja el sitio a medio subir, que es el peor
      # resultado posible.
      #
      # lftp sí reintenta y continúa donde iba.
      #
      # Se sube el sitio entero cada vez, unos 4 minutos. Podría parecer que
      # `--only-newer` lo evitaría, pero sería mentira: cada compilación
      # regenera los ficheros con fecha nueva, así que TODOS parecerían más
      # recientes igualmente. Y saltárselos por tamaño (`--ignore-time`)
      # rompería el caso que más importa: cambiar un precio de 590 a 690 deja
      # el fichero del mismo tamaño, y esa página nunca se actualizaría.
      # Cuatro minutos son un precio razonable por no publicar datos viejos.
      - name: Sincronizar por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # lftp lee la contraseña de esta variable con --env-password, así no
          # aparece nunca en la línea de órdenes (que sí queda en los logs del
          # proceso) ni se rompe si lleva comas o comillas.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          SIMULACION: ${{ inputs.simulacion }}
        run: |
          set -euo pipefail
          SECO=""
          if [ "${SIMULACION:-false}" = "true" ]; then
            SECO="--dry-run"
            echo "MODO SIMULACIÓN: no se escribe nada en el servidor."
          fi

          lftp -u "$FTP_USERNAME" --env-password "ftps://$FTP_SERVER" <<LFTP
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            # El certificado del FTP lo emite el hosting para el nombre de su
            # servidor (premium127...), no para el dominio por el que
            # entramos, así que la verificación fallaría siempre. El tráfico
            # sigue cifrado; lo que se desactiva es comprobar a quién
            # pertenece el certificado.
            set ssl:verify-certificate no
            # Reintentos: es justo lo que faltaba antes.
            set net:max-retries 10
            set net:reconnect-interval-base 5
            set net:timeout 20
            set ftp:use-mdtm off
            set xfer:clobber on
            mirror --reverse --continue --parallel=3 --verbose=1 --exclude-glob .git* $SECO ./out/ "$FTP_SERVER_DIR"
            bye
          LFTP
