name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js app
        run: |
          npm run build
          touch out/.nojekyll
        env:
          NODE_ENV: production
          # Dónde vive REALMENTE el sitio hoy. De aquí salen el canonical, los
          # hreflang, el sitemap y robots.txt, así que si no coincide con el
          # host, Google recibe URLs que no resuelven. El valor por defecto
          # del código es el dominio de marca (gotomapi.pe): cuando el sitio
          # se mueva allí, basta con borrar esta línea.
          NEXT_PUBLIC_SITE_URL: https://sankarea270.github.io/mapi
          # GitHub Pages sirve desde /<repo>. Es la excepción: el resto de
          # hostings (Appwrite, dominio propio) usan la raíz, que es el valor
          # por defecto del código.
          BASE_PATH: /mapi
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4